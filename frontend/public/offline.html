<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0B" />
  <title>Offline — Forge AI Squat Analyser</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0B0B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background-color: rgba(224, 58, 30, 0.15);
      border: 1px solid rgba(224, 58, 30, 0.4);
      color: #E03A1E;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0 0 12px 0;
    }
    p {
      color: #888888;
      font-size: 14px;
      line-height: 1.6;
      max-width: 420px;
      margin: 0 0 24px 0;
    }
    .btn {
      padding: 12px 24px;
      background-color: #E03A1E;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #B02E18;
    }
  </style>
</head>
<body>
  <div class="badge">Connection Required</div>
  <h1>You Are Currently Offline</h1>
  <p>
    The Forge app shell is cached locally, but video pose estimation, bar tracking, and kinematic assessment require an active network connection to reach the computer-vision pipeline.
  </p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
