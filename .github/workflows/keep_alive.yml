name: Keep-Alive Health Ping

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier idle spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live Render health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://forge-squat-analyzer.onrender.com/health)
          echo "GET https://forge-squat-analyzer.onrender.com/health -> HTTP $status"
          test "$status" -eq 200
